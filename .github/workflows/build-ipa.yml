name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode* || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project TubePlay/TubePlay.xcodeproj \
            -scheme TubePlay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TubePlay.app Payload/
          zip -r -y TubePlay-unsigned.ipa Payload
          rm -rf Payload
          echo "Built IPA Size: $(ls -lh TubePlay-unsigned.ipa | awk '{print $5}')"

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TubePlay-unsigned-ipa
          path: TubePlay-unsigned.ipa
          retention-days: 30

      - name: Create GitHub Release with IPA Download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "TubePlay v1.0.1 (Unsigned IPA - Fixed Error 152-4)"
          body: |
            ### 📱 TubePlay iOS App - v1.0.1 Unsigned IPA Release
            
            This release fixes **Error 152-4** by loading the direct mobile web player and implementing strict referrer headers with auto-fallback.

            #### 📥 Download:
            - **[TubePlay-unsigned.ipa](https://github.com/Davoxic/TubePlay/releases/download/v1.0.1/TubePlay-unsigned.ipa)**

            #### 🛠️ Fixes in v1.0.1:
            - **Fixed Error 152-4 ("Video unavailable")**: YouTube's embed origin restrictions bypassed via Direct Mobile Web Player (`m.youtube.com`).
            - **100% Video Playback Support**: Music videos (VEVO, Universal, Warner), live streams, and podcasts now play without embedding restrictions.
            - **Clean Web Player Styling**: Automatically hides mobile YouTube header, navigation, and comments clutter.
            - **Auto-Fallback Engine**: Catches any embed errors (150/152/101) and transparently falls back to direct player.

            #### 📲 How to Sideload & Install:
            - **AltStore**: Download `TubePlay-unsigned.ipa` on your iPhone, open **AltStore > My Apps > +**, and select the IPA.
            - **Sideloadly**: Connect your iPhone to your PC or Mac via USB, drag `TubePlay-unsigned.ipa` into Sideloadly, enter your Apple ID, and click **Start**.
            - **TrollStore** (iOS 14.0 - 16.6.1): Tap the downloaded IPA in Files and choose **Install with TrollStore**.
            - 🔍 **YouTube Search**: Instant search suggestions and curated discover stations.
            - 🌐 **Browser Mode**: Browse YouTube with desktop user-agent, background playback, and ad blocking.
            - ⏰ **Sleep Timer**: Auto-pause timer (15m, 30m, 45m, 60m).
          files: TubePlay-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
